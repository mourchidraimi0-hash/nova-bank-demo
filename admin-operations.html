<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Registre de toutes les opérations clients NOVA BANK, avec gestion des statuts.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex, nofollow">
<title>Opérations — Back-office NOVA BANK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">
<div class="admin-mobile-topbar">
  <button data-sidebar-toggle class="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
  <span class="nav-logo" style="color:var(--anthracite)"><span class="logo-mark">NB</span></span>
  <button data-theme-toggle class="theme-toggle"></button>
</div>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="admin-dashboard.html" class="nav-logo"><span class="logo-mark">NB</span> Back-office</a>
    <span class="admin-role-tag" data-admin-role></span>
    <nav class="admin-nav">
      <a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Tableau de bord</a>
      <a href="admin-clients.html"><i class="fa-solid fa-users"></i> Clients</a>
      <a href="admin-operations.html" class="active"><i class="fa-solid fa-arrow-right-arrow-left"></i> Opérations</a>
      <a href="admin-journal.html"><i class="fa-solid fa-scroll"></i> Journal d'activité</a>
    </nav>
    <div class="bottom-links">
      <span class="text-sm" style="color:rgba(255,255,255,.6)">Connecté : <span data-admin-name></span></span>
      <a href="#" data-admin-logout><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a>
    </div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Opérations</h1>
      <button data-theme-toggle class="theme-toggle"></button>
    </div>

    <div class="admin-card">
      <div class="filters-row">
        <input type="text" class="form-control" id="searchInput" placeholder="Rechercher par référence, client ou bénéficiaire…">
        <select class="form-control" id="statusFilter">
          <option value="all">Tous les statuts</option>
          <option value="pending">En attente</option>
          <option value="processing">En cours</option>
          <option value="confirmed">Confirmée</option>
          <option value="rejected">Rejetée</option>
          <option value="cancelled">Annulée</option>
        </select>
      </div>
      <p class="field-hint">La colonne « Code d'activation » reprend la référence de l'opération à titre de repère interne ; elle ne constitue pas une preuve bancaire indépendante.</p>
      <div id="tableWrap"></div>
    </div>
  </main>
</div>
<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script>
  const session = ADMIN_UI.guard();
  if (session) {
    const TYPE_LABELS = { transfer_out: 'Virement sortant', credit: 'Crédit manuel', debit: 'Débit manuel' };
    const STATUS_OPTIONS = [
      ['pending', 'En attente'],
      ['processing', 'En cours'],
      ['confirmed', 'Confirmée'],
      ['rejected', 'Rejetée'],
      ['cancelled', 'Annulée']
    ];
    const canManage = DB.canManageAccounts(session.role);

    function amountSign(op) {
      return op.type === 'credit' ? '+' : '-';
    }

    function render() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const ops = DB.getAllOperations().filter(op => {
        if (status !== 'all' && op.status !== status) return false;
        if (!q) return true;
        const haystack = `${op.ref} ${op.clientName} ${op.beneficiary || ''}`.toLowerCase();
        return haystack.includes(q);
      });

      const wrap = document.getElementById('tableWrap');
      if (!ops.length) {
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-receipt"></i><p>Aucune opération ne correspond à ces critères.</p></div>';
        return;
      }

      const rows = ops.map(op => {
        const options = STATUS_OPTIONS.map(([val, label]) =>
          `<option value="${val}" ${op.status === val ? 'selected' : ''}>${label}</option>`
        ).join('');
        return `
        <tr>
          <td><code>${escapeHtml(op.ref)}</code></td>
          <td><a href="admin-client-detail.html?id=${encodeURIComponent(op.userId)}" class="op-client-link">${escapeHtml(op.clientName)}</a></td>
          <td>${timeAgo(op.createdAt)}</td>
          <td>${TYPE_LABELS[op.type] || escapeHtml(op.type)}</td>
          <td>${amountSign(op)}${DB.formatMoney(Math.abs(op.amount), op.currency)}</td>
          <td>${escapeHtml(op.currency)}</td>
          <td>
            <select class="form-control op-status-select" data-requires="manage" data-user-id="${escapeHtml(op.userId)}" data-ref="${escapeHtml(op.ref)}">
              ${options}
            </select>
          </td>
          <td>${timeAgo(op.updatedAt)}</td>
          <td><code>${escapeHtml(op.ref)}</code></td>
        </tr>`;
      }).join('');

      wrap.innerHTML = `
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Référence</th><th>Client</th><th>Date/heure</th><th>Type</th>
                <th>Montant</th><th>Devise</th><th>Statut</th><th>Dernière modification</th><th>Code d'activation</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;

      wrap.querySelectorAll('.op-status-select').forEach(sel => {
        sel.addEventListener('change', () => {
          if (!DB.canManageAccounts(session.role)) return;
          const userId = sel.getAttribute('data-user-id');
          const ref = sel.getAttribute('data-ref');
          DB.updateTransactionStatus(userId, ref, sel.value);
          render();
        });
      });

      if (!canManage) {
        wrap.querySelectorAll('.op-status-select').forEach(sel => {
          sel.classList.add('role-hidden');
          sel.disabled = true;
        });
      }
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    render();
  }
</script>
<style>
  .op-client-link{color:var(--cyan-dark);font-weight:600;}
  .op-status-select{min-width:150px;}
</style>
</body>
</html>
