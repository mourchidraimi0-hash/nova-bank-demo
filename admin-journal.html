<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>/* gh-pages-redirect */if(location.hostname==="mourchidraimi0-hash.github.io"){location.replace("https://nova-bank-demo-ten.vercel.app"+location.pathname.replace(/^\/nova-bank-demo/,"")+location.search);}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="admin">
<div class="admin-mobile-topbar">
  <button data-sidebar-toggle class="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
  <span class="nav-logo" style="color:var(--anthracite)"><span class="logo-mark">NB</span></span>
  <button data-theme-toggle class="theme-toggle"></button>
</div>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="admin-dashboard.html" class="nav-logo"><span class="logo-mark">NB</span> Back-office</a>
    <span class="admin-role-tag" data-admin-role></span>
    <nav class="admin-nav">
      <a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Tableau de bord</a>
      <a href="admin-clients.html"><i class="fa-solid fa-users"></i> Clients</a>
      <a href="admin-operations.html"><i class="fa-solid fa-arrow-right-arrow-left"></i> Opérations</a>
      <a href="admin-journal.html" class="active"><i class="fa-solid fa-scroll"></i> Journal d'activité</a>
    </nav>
    <div class="bottom-links">
      <span class="text-sm" style="color:rgba(255,255,255,.6)">Connecté : <span data-admin-name></span></span>
      <a href="#" data-admin-logout><i class="fa-solid fa-right-from-bracket"></i> Déconnexion</a>
    </div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Journal d'activité</h1>
      <button data-theme-toggle class="theme-toggle"></button>
    </div>

    <div class="admin-card">
      <div class="filters-row">
        <input type="text" class="form-control" id="searchInput" placeholder="Rechercher par action, détail ou administrateur…">
      </div>
      <p class="field-hint">Ce journal est permanent et non modifiable : aucune entrée ne peut être supprimée ou éditée, y compris par un Super Admin.</p>
      <div id="logWrap"></div>
      <div class="pagination-row" id="paginationRow"></div>
    </div>
  </main>
</div>
<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script>
(async function () {
  const session = await ADMIN_UI.guard();
  if (session) {
    const ACTION_LABELS = {
      inscription_client: "Inscription d'un client",
      connexion_admin: 'Connexion administrateur',
      deconnexion_admin: 'Déconnexion administrateur',
      virement_initie: 'Virement initié',
      suspension_compte: 'Suspension de compte',
      reactivation_compte: 'Réactivation de compte',
      activation_compte: 'Activation de compte',
      demande_informations: "Demande d'informations",
      ajustement_solde: 'Ajustement de solde',
      changement_statut_operation: "Changement de statut d'opération",
      note_ajoutee: 'Note ajoutée'
    };
    const PAGE_SIZE = 25;
    let currentPage = 1;
    let debounceTimer = null;

    async function render() {
      const q = (document.getElementById('searchInput').value || '').trim();
      const { entries, total } = await DB.getActivityLog({ page: currentPage, pageSize: PAGE_SIZE, q });

      const wrap = document.getElementById('logWrap');
      if (!entries.length) {
        wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-scroll"></i><p>Aucune entrée ne correspond à ces critères.</p></div>';
        document.getElementById('paginationRow').innerHTML = '';
        return;
      }

      wrap.innerHTML = entries.map(e => `
        <div class="log-item">
          <div><b>${escapeHtml(ACTION_LABELS[e.action] || e.action)}</b></div>
          <div>${escapeHtml(e.detail)}</div>
          <div class="meta">${escapeHtml(e.adminName || 'Système')} (${escapeHtml(e.role ? DB.roleLabel(e.role) : 'Système')}) — ${timeAgo(e.date)}</div>
        </div>
      `).join('');

      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      document.getElementById('paginationRow').innerHTML = `
        <span class="text-sm text-muted">${total} entrée${total > 1 ? 's' : ''} — page ${currentPage} sur ${totalPages}</span>
        <div class="flex gap-8">
          <button type="button" class="btn btn-outline btn-sm" id="btnPrevPage" ${currentPage <= 1 ? 'disabled' : ''}>&larr; Précédent</button>
          <button type="button" class="btn btn-outline btn-sm" id="btnNextPage" ${currentPage >= totalPages ? 'disabled' : ''}>Suivant &rarr;</button>
        </div>
      `;
      document.getElementById('btnPrevPage')?.addEventListener('click', () => { if (currentPage > 1) { currentPage--; render(); } });
      document.getElementById('btnNextPage')?.addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; render(); } });
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => { currentPage = 1; render(); }, 350);
    });
    render();
  }
})();
</script>
</body>
</html>
