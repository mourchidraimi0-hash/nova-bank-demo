<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>/* gh-pages-redirect */if(location.hostname==="mourchidraimi0-hash.github.io"){location.replace("https://nova-bank-demo-ten.vercel.app"+location.pathname.replace(/^\/nova-bank-demo/,"")+location.search);}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Réinitialisez votre mot de passe NOVA BANK à l'aide de votre lien de réinitialisation.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex, nofollow">
<title>Nouveau mot de passe — NOVA BANK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar scrolled">
  <div class="container">
    <a href="index.html" class="nav-logo"><span class="logo-mark">NB</span> NOVA BANK</a>
    <div class="nav-actions"><a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Retour au site</a></div>
  </div>
</nav>

<div class="form-page">
  <div class="form-card">
    <h1>Nouveau mot de passe</h1>
    <p class="sub">Choisissez un nouveau mot de passe pour votre compte NOVA BANK.</p>

    <div class="alert alert-error hidden" id="error-box">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="error-text"></span>
    </div>

    <section id="form-section">
      <form id="reset-form" novalidate>
        <div class="form-row">
          <label for="password">Nouveau mot de passe</label>
          <input type="password" id="password" class="form-control" autocomplete="new-password" required>
          <div class="pw-strength"><span></span><span></span><span></span><span></span></div>
          <div class="pw-strength-label"></div>
          <div class="field-error" id="error-password"></div>
        </div>
        <div class="form-row">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input type="password" id="confirmPassword" class="form-control" autocomplete="new-password" required>
          <div class="field-error" id="error-confirmPassword"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Réinitialiser le mot de passe</button>
      </form>
    </section>

    <section id="success-section" class="hidden">
      <div class="alert alert-success">
        <i class="fa-solid fa-circle-check"></i>
        <div>Votre mot de passe a été réinitialisé avec succès. Pour votre sécurité, toutes vos sessions actives ont été déconnectées.</div>
      </div>
      <a href="connexion.html" class="btn btn-primary btn-block mt-16">Se connecter</a>
    </section>

    <p class="text-sm text-muted mt-24" style="text-align:center;"><a href="connexion.html">Retour à la connexion</a></p>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const errorBox = document.getElementById('error-box');
  const errorText = document.getElementById('error-text');
  const formSection = document.getElementById('form-section');
  const successSection = document.getElementById('success-section');

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.remove('hidden');
  }

  if (!token) {
    formSection.classList.add('hidden');
    showError("Ce lien de réinitialisation est invalide. Merci de recommencer la procédure depuis la page de connexion.");
    return;
  }

  function clearFieldErrors() {
    document.querySelectorAll('.field-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
    document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));
  }
  function setFieldError(field, msg) {
    const el = document.getElementById('error-' + field);
    if (el) { el.textContent = msg; el.classList.add('show'); }
    const input = document.getElementById(field);
    if (input) input.classList.add('error');
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');
    clearFieldErrors();

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    let hasError = false;
    if (!password || password.length < 8 || !/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
      setFieldError('password', 'Le mot de passe doit contenir au moins 8 caractères, avec au moins une lettre et un chiffre.');
      hasError = true;
    }
    if (!confirmPassword || confirmPassword !== password) {
      setFieldError('confirmPassword', 'Les mots de passe ne correspondent pas.');
      hasError = true;
    }
    if (hasError) return;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Réinitialisation en cours…';

    try {
      await DB.resetPassword(token, password);
      formSection.classList.add('hidden');
      successSection.classList.remove('hidden');
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Réinitialiser le mot de passe';
      showError(err.message);
    }
  });
})();
</script>
</body>
</html>
