<script>
(async function () {
  const user = await DB.requireClientAuth();
  if (user) {
    document.getElementById('logoutLink')?.addEventListener('click', (e) => { e.preventDefault(); DB.logout(); window.location.href = 'connexion.html'; });

    const TYPE_LABELS = { transfer_out: 'Outgoing transfer', credit: 'Credit', debit: 'Debit' };
    function humanType(t) { return TYPE_LABELS[t] || t; }

    function getFiltered(all) {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;
      const type = document.getElementById('typeFilter').value;
      return all.filter(t => {
        if (status && t.status !== status) return false;
        if (type && t.type !== type) return false;
        if (q) {
          const hay = [t.description, t.ref, t.beneficiary].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    async function renderTable() {
      const fresh = (await DB.getUserById(user.id)) || user;
      const all = fresh.transactions || [];
      const filtered = getFiltered(all);
      const wrap = document.getElementById('tableWrap');

      if (!all.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-inbox"></i>
            <p>No operations yet.</p>
          </div>`;
        return;
      }
      if (!filtered.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-filter-circle-xmark"></i>
            <p>No operations match these filters.</p>
          </div>`;
        return;
      }

      const rows = filtered.map(t => {
        const isOut = t.type === 'transfer_out' || t.type === 'debit';
        const sign = isOut ? '-' : '+';
        const cls = isOut ? 'amount-neg' : 'amount-pos';
        const benef = t.beneficiary ? ` <span class="text-muted text-sm">(${escapeHtml(t.beneficiary)})</span>` : '';
        return `
          <tr>
            <td><code>${escapeHtml(t.ref)}</code></td>
            <td>${escapeHtml(t.description)}${benef}</td>
            <td>${timeAgo(t.createdAt)}</td>
            <td>${escapeHtml(humanType(t.type))}</td>
            <td>${statusBadge(t.status)}</td>
            <td class="${cls}">${sign}${DB.formatMoney(t.amount, t.currency)}</td>
          </tr>`;
      }).join('');

      wrap.innerHTML = `
        <table class="data-table">
          <thead>
            <tr><th>Reference</th><th>Description</th><th>Date</th><th>Type</th><th>Status</th><th>Amount</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    async function exportCsv() {
      const fresh = (await DB.getUserById(user.id)) || user;
      const filtered = getFiltered(fresh.transactions || []);
      const header = ['Reference', 'Description', 'Date', 'Type', 'Status', 'Amount', 'Currency'];
      const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [header.map(esc).join(';')];
      filtered.forEach(t => {
        const isOut = t.type === 'transfer_out' || t.type === 'debit';
        const amount = (isOut ? '-' : '+') + Number(t.amount).toFixed(2);
        lines.push([t.ref, t.description, timeAgo(t.createdAt), humanType(t.type), t.status, amount, t.currency].map(esc).join(';'));
      });
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `transactions_${fresh.accountNumber || 'nova-bank'}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById('searchInput').addEventListener('input', renderTable);
    document.getElementById('statusFilter').addEventListener('change', renderTable);
    document.getElementById('typeFilter').addEventListener('change', renderTable);
    document.getElementById('exportBtn').addEventListener('click', exportCsv);

    await renderTable();
  }
})();
</script>
