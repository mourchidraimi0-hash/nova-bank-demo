<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script>
(async function () {
  const user = await DB.requireClientAuth();
  if (user) {
    document.getElementById('logoutLink')?.addEventListener('click', (e) => { e.preventDefault(); DB.logout(); window.location.href = 'connexion.html'; });

    const ICONS = { info: 'fa-circle-info', success: 'fa-circle-check', warn: 'fa-triangle-exclamation', danger: 'fa-shield-halved' };
    let currentFilter = 'all';

    async function renderNotifications() {
      const fresh = (await DB.getUserById(user.id)) || user;
      const all = fresh.notifications || [];
      const unreadCount = all.filter(n => !n.read).length;

      document.getElementById('markAllBtn').classList.toggle('hidden', unreadCount === 0);

      const list = currentFilter === 'all' ? all : all.filter(n => n.type === currentFilter);
      const wrap = document.getElementById('notifListWrap');

      if (!list.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-bell-slash"></i>
            <p>${all.length ? "No notification matches this filter." : "You have no notifications at this time."}</p>
          </div>`;
        return;
      }

      wrap.innerHTML = list.map(n => `
        <div class="notif-list-item ${n.read ? '' : 'unread'}" data-id="${escapeHtml(n.id)}"${n.read ? '' : ' style="cursor:pointer"'}>
          <div class="n-icon"><i class="fa-solid ${ICONS[n.type] || 'fa-circle-info'}"></i></div>
          <div class="n-body">
            <p>${escapeHtml(n.message)}</p>
            <div class="n-meta">${timeAgo(n.date)}</div>
          </div>
          ${n.read ? '' : '<div class="notif-dot"></div>'}
        </div>`).join('');
    }

    document.getElementById('notifFilters').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      currentFilter = btn.getAttribute('data-filter');
      document.querySelectorAll('#notifFilters button').forEach(b => b.classList.toggle('active', b === btn));
      renderNotifications();
    });

    document.getElementById('notifListWrap').addEventListener('click', async (e) => {
      const item = e.target.closest('.notif-list-item');
      if (!item) return;
      await DB.markNotificationRead(user.id, item.getAttribute('data-id'));
      await renderNotifications();
      if (typeof initNotifBadge === 'function') initNotifBadge();
    });

    document.getElementById('markAllBtn').addEventListener('click', async () => {
      await DB.markAllNotificationsRead();
      await renderNotifications();
      if (typeof initNotifBadge === 'function') initNotifBadge();
    });

    await renderNotifications();
  }
})();
</script>
