<script>
(async function () {
  const user = await DB.requireClientAuth();
  if (user) {
    document.getElementById('logoutLink')?.addEventListener('click', (e) => { e.preventDefault(); DB.logout(); window.location.href = 'connexion.html'; });

    // ---- expiration computed on the fly (createdAt + 4 years), nothing is stored
    function cardExpiry(createdAt) {
      const d = new Date(createdAt);
      d.setFullYear(d.getFullYear() + 4);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yy = String(d.getFullYear()).slice(-2);
      return `${mm}/${yy}`;
    }

    // ---- cosmetic card preferences (localStorage, purely demo)
    function getCardPrefs(cardId) {
      try {
        const raw = localStorage.getItem('novabank_card_prefs_' + cardId);
        const defaults = { online: true, contactless: true, abroad: true };
        return raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
      } catch (e) {
        return { online: true, contactless: true, abroad: true };
      }
    }
    function setCardPref(cardId, key, value) {
      const prefs = getCardPrefs(cardId);
      prefs[key] = value;
      localStorage.setItem('novabank_card_prefs_' + cardId, JSON.stringify(prefs));
    }

    function switchRow(cardId, prefKey, checked, title, desc) {
      return `
        <div class="switch-row">
          <div class="switch-label"><b>${escapeHtml(title)}</b><span>${escapeHtml(desc)}</span></div>
          <label class="switch">
            <input type="checkbox" data-card-id="${escapeHtml(cardId)}" data-pref="${prefKey}" ${checked ? 'checked' : ''}>
            <span class="track"></span>
          </label>
        </div>`;
    }

    async function renderPage() {
      const fresh = (await DB.getUserById(user.id)) || user;
      const cards = DB.getCards(fresh);
      const wrap = document.getElementById('cardsWrap');

      if (!cards.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-credit-card"></i>
            <p>No card is associated with your account at this time.</p>
          </div>`;
        return;
      }

      const holder = `${fresh.firstName} ${fresh.lastName}`;

      wrap.innerHTML = cards.map(card => {
        const prefs = getCardPrefs(card.id);
        return `
        <div style="margin-bottom:36px;">
          <div class="bank-card compact${card.frozen ? ' frozen' : ''}">
            ${card.frozen ? '<div class="frozen-badge">Frozen</div>' : ''}
            <div class="chip"></div>
            <div class="num">•••• •••• •••• ${escapeHtml(card.last4)}</div>
            <div class="row">
              <div><span>Holder</span><b>${escapeHtml(holder)}</b></div>
              <div><span>Expires</span><b>${cardExpiry(card.createdAt)}</b></div>
            </div>
          </div>
          <div class="card-actions-row">
            <button class="btn ${card.frozen ? 'btn-cyan' : 'btn-outline'} btn-sm" data-freeze-btn data-card-id="${escapeHtml(card.id)}">
              <i class="fa-solid ${card.frozen ? 'fa-lock-open' : 'fa-lock'}"></i>
              ${card.frozen ? 'Unfreeze card' : 'Freeze card'}
            </button>
          </div>

          <div class="card" style="margin-top:20px;">
            <h3 class="mb-16">Card settings${cards.length > 1 ? ' — ' + escapeHtml(card.label) : ''}</h3>
            ${switchRow(card.id, 'online', prefs.online, 'Online payments', 'Allow online purchases with this card.')}
            ${switchRow(card.id, 'contactless', prefs.contactless, 'Contactless payments', 'Allow contactless in-store payment.')}
            ${switchRow(card.id, 'abroad', prefs.abroad, "Withdrawals abroad", 'Allow ATM withdrawals outside your country of residence.')}
          </div>
        </div>`;
      }).join('');
    }

    document.getElementById('cardsWrap').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-freeze-btn]');
      if (!btn) return;
      try {
        await DB.toggleCardFreeze(user.id, btn.getAttribute('data-card-id'));
        await renderPage();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('cardsWrap').addEventListener('change', (e) => {
      const input = e.target.closest('input[data-pref]');
      if (!input) return;
      setCardPref(input.getAttribute('data-card-id'), input.getAttribute('data-pref'), input.checked);
    });

    await renderPage();
  }
})();
</script>
